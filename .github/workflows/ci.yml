name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js for browser logic tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run browser logic tests
        run: node --test tests/browser/*.test.cjs

      - name: Run pytest
        env:
          # Provide dummy values so app initialisation doesn't fail during tests.
          GROQ_API_KEY: dummy
          SECRET_KEY: ci-test-secret-key
        run: pytest --tb=short -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: safedrive-bkk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
