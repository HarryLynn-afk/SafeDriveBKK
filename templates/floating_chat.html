<!-- Floating Chat Assistant -->
<button
    class="chat-fab"
    id="chatFab"
    type="button"
    title="Open Safety Assistant"
    aria-label="Open Safety Assistant"
    aria-expanded="false"
    aria-controls="chatWidget"
>
    <span class="chat-fab-icon chat-fab-open-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 18.5c-1.4 0-2.5-1.1-2.5-2.5V8.5C4.5 7.1 5.6 6 7 6h10c1.4 0 2.5 1.1 2.5 2.5V16c0 1.4-1.1 2.5-2.5 2.5h-5.8l-3.4 2.8c-.2.2-.6 0-.5-.3l.4-2.5H7Z"></path>
            <path d="M8.75 12h.01"></path>
            <path d="M12 12h.01"></path>
            <path d="M15.25 12h.01"></path>
        </svg>
    </span>
    <span class="chat-fab-icon chat-fab-close-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
        </svg>
    </span>
    <span class="visually-hidden">Safety Assistant</span>
</button>

<div class="chat-widget-overlay" id="chatWidget" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="chatWidgetTitle">
    <!-- Header -->
    <div class="chat-widget-header">
        <div class="chat-widget-title">
            <h3 id="chatWidgetTitle">Safety Assistant</h3>
            <div class="chat-widget-status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </div>
        <button class="chat-widget-close" id="chatWidgetClose" title="Close">&times;</button>
    </div>

    <!-- Messages -->
    <div class="chat-widget-messages" id="chatWidgetMessages">
        <div class="message bot">
            <div class="message-avatar message-avatar--bot" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.25 18 5.75v5.6c0 4.2-2.7 7.97-6 9.4-3.3-1.43-6-5.2-6-9.4v-5.6L12 3.25Z"></path>
                    <path d="m9.2 12.1 1.8 1.8 3.8-4"></path>
                </svg>
            </div>
            <div class="message-content">
                <div class="message-bubble">
                    <div class="message-body">
                        <p>Ask about <strong>historical crash locations</strong>, <strong>time patterns</strong>, or <strong>recorded causes</strong> across Bangkok. Use the Trip Planner for route-specific analysis.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick suggestions -->
    <div class="chat-widget-suggestions" id="chatWidgetSuggestions">
        <button class="suggestion-chip" data-question="Which areas are most dangerous?">Dangerous areas</button>
        <button class="suggestion-chip" data-question="When is the safest time to drive?">Safe times</button>
        <button class="suggestion-chip" data-question="What should Bangkok do?">Recommendations</button>
    </div>

    <!-- Input -->
    <div class="chat-widget-input">
        <input
            type="text"
            id="chatWidgetInput"
            placeholder="Ask about road safety..."
            autocomplete="off"
        >
        <button id="chatWidgetSend" title="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
